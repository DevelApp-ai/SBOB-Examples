name: php-detection

# Scenario B (PHP2Shell) M6 lane: live post-exploit behavior vs SBoB detection.
#
# Proves, in one disposable CI environment (TDS §7):
#   1. the SBoB php-fpm bundle transpiles from the SHA-pinned SBoB repo
#   2. the four post-exploit behaviors run FOR REAL inside the php-fpm
#      workload container, loopback-only stand-ins (TDS §4)
#   3. the capture is faithful and safe (parity checker)
#   4. the recorded corpus replays identically to the proven Stage 1
#      (parity leg, scripts from the pinned SBoB repo): benign silent,
#      drift fires 100111/100121/100131/100163, sustained 100112/100122/100132
#   5. the LIVE-captured telemetry replays HONESTLY, firing what this
#      observer model can fire: 100163 (memfd, node-scoped signature key
#      attributed by uid 33). The exe-scoped legs (100111/100121/100131)
#      cannot tag a containerized workload observed node-side — the
#      node-side auditd resolves the binary through the overlay2 path, not
#      /usr/local/sbin/php-fpm — which is the honest SBoB finding this
#      scenario records (delta 7): the behaviors execute for real, are
#      proven by their side effects, their rules are proven on the corpus
#      (leg 1), and the live replay asserts they correctly stay absent.
#      The benign window is empty in this mode (same finding) and stays
#      silent vacuously; benign silence on tagged content is leg 1.
#
# Observer model: GitHub-hosted runner containers cannot hold the audit
# netlink (in-container auditctl returns EPERM even under --privileged —
# proven live in this lane's development). auditd therefore runs ON THE
# NODE and the node audit log is bind-mounted read-only into the workload
# container — the same deployment model as production SBoB: the agent
# (auditd) observes the node, the workload runs in a container. The
# exe-scoping boundary above is what that production model actually
# yields for containerized workloads; on a self-hosted node with the
# in-container observer the exe-scoped keys tag normally.
#
# The lane uses expected-verdict assertions and fails loudly with
# diagnostics; it is never left permanently red (TDS §7).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scenarios/php2shell/**"
      - ".github/workflows/php-detection.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA-pinned toolchain (TDS §7/§8): the SBoB repo providing the php-fpm
  # contract, the transpiler and the proven Stage-1 replay scripts.
  SBOB_REPO: DevelApp-ai/Software-Bill-of-Behavior
  SBOB_PIN: 1e7c0db71049f950160234804eca301dc6ce3977
  # disposable manager (proven lab-validate pattern; 4.x keeps both the
  # wazuh-logtest binary and the PUT /logtest API)
  WAZUH_IMAGE: wazuh/wazuh-manager:4.14.6
  WAZUH_CONTAINER: sbob-wazuh-manager
  WAZUH_API: https://localhost:55000
  WAZUH_API_USER: wazuh
  WAZUH_API_PASS: wazuh
  WORKLOAD_CONTAINER: sbob-php-workload

jobs:
  php-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SBOB-Examples
        uses: actions/checkout@v4

      - name: Checkout the SHA-pinned SBoB toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SBOB_REPO }}
          ref: ${{ env.SBOB_PIN }}
          path: sbob-repo

      - name: Node 22 (native type stripping, zero npm install)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start the node-side audit observer (auditd on the CI node)
        run: |
          # GitHub-hosted runner containers cannot hold the audit netlink
          # (in-container auditctl returns EPERM even under --privileged;
          # proven in this lane's diagnostics). The observer therefore runs
          # ON THE NODE — which is also the production SBoB deployment
          # model: auditd on the node observes the containerized workload.
          echo "--- /proc/cmdline ---"; cat /proc/cmdline
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq auditd >/dev/null 2>&1 || true
          sudo service auditd start >/dev/null 2>&1 || sudo auditd || true
          sleep 1
          echo "--- auditctl -s (node) ---"; sudo auditctl -s 2>&1 || true
          echo "--- auditctl -l (node) ---"; sudo auditctl -l 2>&1 || true
          sudo auditctl -l >/dev/null 2>&1 || { echo "FAIL: node auditctl not functional"; exit 1; }
          echo "OK: node-side auditd is the observer"

      - name: Transpile the php-fpm bundle (SHA-pinned SBoB toolchain)
        run: |
          cd sbob-repo
          node src/cli.ts transpile --sbob sbobs/php-fpm.yaml \
            --out "$GITHUB_WORKSPACE/dist/php" \
            --target linux \
            --registry docs/sbob-registry.yaml --skip-signature-verify
          cd "$GITHUB_WORKSPACE"
          echo "--- bundle files ---"
          find dist/php -type f | sort
          test -f dist/php/wazuh/audit/sbob/php-fpm.rules \
            || { echo "FAIL: transpiled audit fragment missing"; exit 1; }
          echo "--- generated audit fragment (what the workload runs under) ---"
          cat dist/php/wazuh/audit/sbob/php-fpm.rules

      - name: Build the php-fpm workload image
        run: |
          set -o pipefail
          docker build \
            -f scenarios/php2shell/workload/Dockerfile \
            -t sbob-php2shell:ci \
            scenarios/php2shell 2>&1 | tee docker-build.log

      - name: "Run the workload container (NET_ADMIN + node audit log mounted read-only)"
        run: |
          docker run --cap-add=NET_ADMIN \
            -v /var/log/audit:/host-audit:ro \
            -d --name "$WORKLOAD_CONTAINER" sbob-php2shell:ci
          for i in $(seq 1 60); do
            if docker exec "$WORKLOAD_CONTAINER" \
                 bash -c '(exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null' 2>/dev/null; then
              echo "workload ready (php-fpm accepting on 9000)"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: workload container did not become ready"
          docker logs "$WORKLOAD_CONTAINER" 2>&1 | tr -d '\r' > workload-docker.log || true
          docker exec "$WORKLOAD_CONTAINER" sh -c \
            'ps aux; ss -lntp 2>/dev/null; ls -la /host-audit/ 2>&1; ip addr show lo 2>&1' \
            2>&1 | tr -d '\r' > workload-state.log || true
          echo "--- docker logs ---"; cat workload-docker.log
          echo "--- workload state ---"; cat workload-state.log
          # annotation channel: surfaced through the public annotations API
          for f in workload-docker.log workload-state.log; do
            [ -f "$f" ] || continue
            n=0
            while IFS= read -r line; do
              n=$((n+1)); [ $n -gt 12 ] && break
              line=$(printf '%s' "$line" | head -c 600)
              [ -n "$line" ] && echo "::error title=workload-not-ready::$f: $line"
            done < "$f"
          done
          exit 1

      - name: Load the SBoB audit fragment into the node kernel
        run: |
          sudo auditctl -D 2>/dev/null || true
          sudo auditctl -R dist/php/wazuh/audit/sbob/php-fpm.rules
          echo "--- loaded rules (node) ---"
          sudo auditctl -l
          # Emission probe: the memfd signature rule is node-scoped and has
          # NO exe/uid filter, so a memfd_create made directly on the runner
          # MUST produce key="sbob-memfd". This discriminates "rules not
          # emitting node-side" from "workload not making the syscalls".
          before=$(sudo grep -c 'key="sbob-memfd"' /var/log/audit/audit.log 2>/dev/null || echo 0)
          python3 - <<'PYEOF'
          import ctypes
          libc = ctypes.CDLL(None, use_errno=True)
          fd = libc.memfd_create(b"sbob-node-probe", 0)
          print("probe memfd_create fd:", fd)
          PYEOF
          sleep 2
          after=$(sudo grep -c 'key="sbob-memfd"' /var/log/audit/audit.log 2>/dev/null || echo 0)
          echo "sbob-memfd record count: before=$before after=$after"
          if [ "${after:-0}" -gt "${before:-0}" ]; then
            echo "OK: node-side sbob emission works (the memfd key fires)"
            echo "::error title=emission-probe::OK node-side sbob emission works — probe memfd_create logged (before=$before after=$after)"
          else
            echo "WARN: probe memfd_create was NOT logged node-side (rules not emitting)"
            echo "::error title=emission-probe::WARN probe memfd_create NOT logged node-side — rules not emitting (before=$before after=$after)"
          fi
          # annotation channel (this step's own 10-cap budget): rules snapshot
          echo "::error title=loaded-rules::$(sudo auditctl -l 2>&1 | tr '\n' '~' | head -c 500)"

      - name: Run the benign + post-exploit request flows and capture the windows
        run: |
          set -o pipefail
          rc=0
          docker exec -e AUDIT_LOG=/host-audit/audit.log "$WORKLOAD_CONTAINER" \
            bash /opt/harness/run-behaviors.sh 2>&1 | tee workload-run.log || rc=$?
          # even on pre-check failure the windows exist in /opt/telemetry:
          # always copy them out so the diagnostics can annotate them
          mkdir -p telemetry-run
          docker cp "$WORKLOAD_CONTAINER:/opt/telemetry/benign.audit" telemetry-run/benign.audit || true
          docker cp "$WORKLOAD_CONTAINER:/opt/telemetry/drift.audit" telemetry-run/drift.audit || true
          sudo grep -E "^(type=SYSCALL|type=EXECVE|type=PATH|type=SOCKADDR)" /var/log/audit/audit.log \
            | tail -200 > telemetry-run/audit-tail.log || true
          echo "--- benign window ---"; cat telemetry-run/benign.audit 2>/dev/null || true
          echo "--- drift window ---"; cat telemetry-run/drift.audit 2>/dev/null || true
          # annotation channel: GitHub caps annotations at 10 per step; this
          # step's own budget, most decisive first. Every loop is -e-safe.
          n_memfd=$(sudo grep -c 'key="sbob-memfd"' /var/log/audit/audit.log 2>/dev/null || true)
          echo "::error title=node-memfd-count::node log sbob-memfd records: ${n_memfd:-0}"
          sudo grep 'key="sbob-memfd"' /var/log/audit/audit.log 2>/dev/null | tail -3 > /tmp/memfd.log || true
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            if [ "$i" -gt 3 ]; then break; fi
            echo "::error title=memfd-record::$(printf '%s' "$line" | head -c 600)"
          done < /tmp/memfd.log
          docker exec "$WORKLOAD_CONTAINER" sh -c 'ls -la /var/tmp/.pwned /var/tmp/.php2shell.php 2>&1' \
            > /tmp/side.log 2>&1 || true
          echo "::error title=side-effects::$(head -2 /tmp/side.log | tr '\n' '~' | head -c 500)"
          echo "::error title=capture-lines::$(grep -E '^\[capture\]' workload-run.log 2>/dev/null | head -8 | tr '\n' '~' | head -c 800)"
          grep -E "^behaviors:" workload-run.log 2>/dev/null | tail -2 > /tmp/beh.log || true
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            if [ "$i" -gt 2 ]; then break; fi
            echo "::error title=behavior-output::$(printf '%s' "$line" | head -c 400)"
          done < /tmp/beh.log
          exit $rc

      - name: "Capture parity + safety check (loopback-only, benign purity, live-fireable leg + delta-7 shape)"
        run: |
          set -o pipefail
          python3 scenarios/php2shell/harness/check_capture.py \
            telemetry-run/benign.audit telemetry-run/drift.audit 2>&1 | tee parity-check.log

      - name: Upload telemetry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php2shell-telemetry
          if-no-files-found: warn
          path: |
            docker-build.log
            restart.log
            workload-docker.log
            workload-state.log
            telemetry-run/benign.audit
            telemetry-run/drift.audit
            telemetry-run/audit-tail.log
            workload-run.log
            parity-check.log
            corpus-gate.log
            api-gate.log
            live-benign-gate.log
            live-drift-gate.log

      # ---- detection stack: the proven lab-validate pattern, pinned SBoB ----

      - name: Start the disposable Wazuh manager (4.14.6)
        run: |
          docker pull "$WAZUH_IMAGE"
          docker run -d --name "$WAZUH_CONTAINER" \
            -p 1514:1514 -p 1515:1515 -p 55000:55000 \
            "$WAZUH_IMAGE"
          for i in $(seq 1 96); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$WAZUH_API" || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then echo "manager API up (HTTP $code)"; exit 0; fi
            if [ $((i % 12)) -eq 0 ]; then echo "...still waiting for the API (HTTP $code)"; fi
            sleep 5
          done
          echo "manager API did not come up"
          docker logs --tail 60 "$WAZUH_CONTAINER" || true
          exit 1

      - name: Install the bundle + declare the CDB lists in ossec.conf
        run: |
          sh sbob-repo/scripts/sync-manager.sh dist/php --root staging
          find staging -type f | sort
          if [ -d staging/rules ]; then
            docker cp staging/rules/. "$WAZUH_CONTAINER:/var/ossec/etc/rules/"
          fi
          if [ -d staging/decoders ]; then
            docker cp staging/decoders/. "$WAZUH_CONTAINER:/var/ossec/etc/decoders/"
          fi
          if [ -d staging/lists ]; then
            docker cp staging/lists/. "$WAZUH_CONTAINER:/var/ossec/etc/lists/"
          fi
          docker cp "$WAZUH_CONTAINER:/var/ossec/etc/ossec.conf" ossec.conf
          : > sbob-lists.snippet
          if [ -d staging/lists/sbob ]; then
            (cd staging/lists && find sbob -type f | sort) | while read -r rel; do
              printf '    <list>etc/lists/%s</list>\n' "$rel"
            done >> sbob-lists.snippet
          fi
          if [ -s sbob-lists.snippet ]; then
            awk '
              BEGIN { while ((getline l < "sbob-lists.snippet") > 0) ins = ins l ORS }
              !done && /<\/ruleset>/ { printf "%s", ins; done = 1 }
              { print }
            ' ossec.conf > ossec.conf.new
            mv ossec.conf.new ossec.conf
            echo "declared lists:" && grep "<list>etc/lists/sbob" ossec.conf
          else
            echo "no CDB lists in this bundle — ossec.conf left untouched"
          fi
          docker cp ossec.conf "$WAZUH_CONTAINER:/var/ossec/etc/ossec.conf"

      - name: Restart the manager and wait for the API (bundle must load cleanly)
        run: |
          docker exec "$WAZUH_CONTAINER" /var/ossec/bin/wazuh-control restart 2>&1 | tee restart.log \
            || echo "wazuh-control restart rc=$? (continuing — the probe below is the gate)"
          code=000
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$WAZUH_API" || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then echo "manager API up after restart (HTTP $code)"; break; fi
            sleep 5
          done
          if [ "$code" = "000" ] || [ -z "$code" ]; then
            echo "manager API did not come back after the bundle install"
            exit 1
          fi
          if docker exec "$WAZUH_CONTAINER" /var/ossec/bin/wazuh-control status 2>/dev/null | grep -q "analysisd.*running"; then
            echo "analysisd running with the bundle loaded"
            exit 0
          fi
          echo "analysisd is NOT running — the manager rejected the ruleset"
          exit 1

      - name: Corpus gate — recorded corpus parity (proven Stage 1, pinned scripts)
        run: |
          set -o pipefail
          docker cp sbob-repo/test "$WAZUH_CONTAINER:/test"
          docker cp sbob-repo/scripts "$WAZUH_CONTAINER:/sbob-scripts"
          docker exec "$WAZUH_CONTAINER" \
            bash -c 'PATH="/var/ossec/bin:$PATH" bash /sbob-scripts/logtest-corpus.sh php' 2>&1 | tee corpus-gate.log

      - name: API gate — recorded corpus, JSON-asserted ids + sustained children
        run: |
          set -o pipefail
          SBOB_WAZUH_API_USER="$WAZUH_API_USER" SBOB_WAZUH_API_PASS="$WAZUH_API_PASS" \
            node sbob-repo/scripts/logtest-api.ts --target php --api "$WAZUH_API" 2>&1 | tee api-gate.log

      - name: Live gate — benign telemetry silent (empty window = delta-7 shape, vacuously silent)
        run: |
          set -o pipefail
          SBOB_WAZUH_API_USER="$WAZUH_API_USER" SBOB_WAZUH_API_PASS="$WAZUH_API_PASS" \
            node scenarios/php2shell/harness/logtest-replay.ts \
            --api "$WAZUH_API" \
            --file telemetry-run/benign.audit --mode benign --repeats 8 2>&1 | tee live-benign-gate.log

      - name: "Live gate — drift fires 100163 (node-scoped key); exe-scoped legs correctly absent (delta 7)"
        run: |
          set -o pipefail
          SBOB_WAZUH_API_USER="$WAZUH_API_USER" SBOB_WAZUH_API_PASS="$WAZUH_API_PASS" \
            node scenarios/php2shell/harness/logtest-replay.ts \
            --api "$WAZUH_API" \
            --file telemetry-run/drift.audit --mode drift \
            --expect 100163 \
            --expect-absent 100111,100121,100131 \
            --repeats 8 2>&1 | tee live-drift-gate.log

      - name: Verdict summary
        if: always()
        run: |
          {
            echo "## php-detection verdict"
            echo "| gate | verdict |"
            echo "|---|---|"
            for f in workload-run.log parity-check.log corpus-gate.log api-gate.log live-benign-gate.log live-drift-gate.log; do
              if [ ! -f "$f" ]; then v="(not reached)"; \
              elif grep -qE "^FAIL:|^ERROR:" "$f"; then v="**FAIL** (see $f)"; \
              else v="PASS (see $f)"; fi
              echo "| $f | $v |"
            done
            echo "SBoB toolchain pin: \`${SBOB_PIN}\` ; manager: \`$WAZUH_IMAGE\`"
            echo "Telemetry windows: attached as the \`php2shell-telemetry\` artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure diagnostics (step summary)
        if: failure()
        run: |
          # diagnostics must never die halfway: no -e, no pipefail surprises
          set +e
          {
            echo "## php-detection diagnostics"
            echo '```'
            echo "--- workload container ---"
            docker ps -a 2>&1 | sed -n 1,20p || true
            docker logs --tail 80 "$WORKLOAD_CONTAINER" 2>&1 || true
            echo "--- node auditctl ---"
            sudo auditctl -l 2>&1 || true
            sudo auditctl -s 2>&1 || true
            echo "--- node audit log tail ---"
            sudo tail -80 /var/log/audit/audit.log 2>&1 || true
            echo "--- manager ossec.log tail ---"
            docker exec "$WAZUH_CONTAINER" sh -c 'tail -40 /var/ossec/logs/ossec.log' 2>&1 || true
            echo "--- gate logs ---"
            for f in workload-run.log parity-check.log corpus-gate.log api-gate.log live-benign-gate.log live-drift-gate.log; do
              if [ -f "$f" ]; then echo "### $f (tail 40)"; tail -40 "$f"; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # annotation channel: GitHub caps annotations at 10 per step —
          # joined summaries, most decisive first, hard budget of 10
          echo "::error title=fail-lines::$(grep -hE '^FAIL:|^ERROR:' workload-run.log parity-check.log corpus-gate.log api-gate.log live-benign-gate.log live-drift-gate.log 2>/dev/null | head -8 | tr '\n' '~' | head -c 800)"
          echo "::error title=harness-evidence::$(grep -hE 'FINDING|\[capture\]|window bounds' workload-run.log 2>/dev/null | head -10 | tr '\n' '~' | head -c 900)"
          for f in telemetry-run/benign.audit telemetry-run/drift.audit; do
            if [ -s "$f" ]; then
              echo "::error title=window-tail::$f: $(tail -3 "$f" 2>/dev/null | tr '\n' '~' | head -c 700)"
            fi
          done
          echo "::error title=audit-tail::$(sudo tail -5 /var/log/audit/audit.log 2>/dev/null | tr '\n' '~' | head -c 700)"
          echo "::error title=loaded-rules::$(sudo auditctl -l 2>&1 | tr '\n' '~' | head -c 700)"
          sudo grep -h '^type=SYSCALL.*key="sbob-' /var/log/audit/audit.log 2>/dev/null | sort -u | tail -3 > /tmp/sbob-records.log || true
          n=0
          while IFS= read -r line; do
            n=$((n+1))
            if [ "$n" -gt 3 ]; then break; fi
            echo "::error title=sbob-record::$(printf '%s' "$line" | head -c 600)"
          done < /tmp/sbob-records.log
