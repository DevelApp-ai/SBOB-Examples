name: php-detection

# Scenario B (PHP2Shell) M6 lane: live post-exploit behavior vs SBoB detection.
#
# Proves, in one disposable CI environment (TDS §7):
#   1. the SBoB php-fpm bundle transpiles from the SHA-pinned SBoB repo
#   2. the four post-exploit behaviors run FOR REAL inside a privileged
#      php-fpm workload container under the bundle's own audit fragment,
#      loopback-only stand-ins (TDS §4)
#   3. the capture is faithful and safe (parity checker)
#   4. the recorded corpus replays identically to the proven Stage 1
#      (parity leg, scripts from the pinned SBoB repo)
#   5. the LIVE-captured telemetry replays green: benign silent (incl.
#      sustained children), drift fires 100111/100121/100131/100163 and the
#      sustained children 100112/100122/100132 via the logtest API
#
# The lane uses expected-verdict assertions and fails loudly with
# diagnostics; it is never left permanently red (TDS §7).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scenarios/php2shell/**"
      - ".github/workflows/php-detection.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA-pinned toolchain (TDS §7/§8): the SBoB repo providing the php-fpm
  # contract, the transpiler and the proven Stage-1 replay scripts.
  SBOB_REPO: DevelApp-ai/Software-Bill-of-Behavior
  SBOB_PIN: 1e7c0db71049f950160234804eca301dc6ce3977
  # disposable manager (proven lab-validate pattern; 4.x keeps both the
  # wazuh-logtest binary and the PUT /logtest API)
  WAZUH_IMAGE: wazuh/wazuh-manager:4.14.6
  WAZUH_CONTAINER: sbob-wazuh-manager
  WAZUH_API: https://localhost:55000
  WAZUH_API_USER: wazuh
  WAZUH_API_PASS: wazuh
  WORKLOAD_CONTAINER: sbob-php-workload

jobs:
  php-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SBOB-Examples
        uses: actions/checkout@v4

      - name: Checkout the SHA-pinned SBoB toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SBOB_REPO }}
          ref: ${{ env.SBOB_PIN }}
          path: sbob-repo

      - name: Node 22 (native type stripping, zero npm install)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Transpile the php-fpm bundle (SHA-pinned SBoB toolchain)
        run: |
          cd sbob-repo
          node src/cli.ts transpile --sbob sbobs/php-fpm.yaml \
            --out "$GITHUB_WORKSPACE/dist/php" \
            --target linux \
            --registry docs/sbob-registry.yaml --skip-signature-verify
          cd "$GITHUB_WORKSPACE"
          echo "--- bundle files ---"
          find dist/php -type f | sort
          test -f dist/php/wazuh/audit/sbob/php-fpm.rules \
            || { echo "FAIL: transpiled audit fragment missing"; exit 1; }
          echo "--- generated audit fragment (what the workload runs under) ---"
          cat dist/php/wazuh/audit/sbob/php-fpm.rules

      - name: Build the php-fpm workload image
        run: |
          docker build \
            -f scenarios/php2shell/workload/Dockerfile \
            -t sbob-php2shell:ci \
            scenarios/php2shell

      - name: Run the workload container (privileged: in-container auditd)
        run: |
          docker run --privileged -d --name "$WORKLOAD_CONTAINER" sbob-php2shell:ci
          for i in $(seq 1 60); do
            if docker exec "$WORKLOAD_CONTAINER" \
                 bash -c '(exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null' 2>/dev/null; then
              echo "workload ready (php-fpm accepting on 9000)"
              docker exec "$WORKLOAD_CONTAINER" auditctl -l || true
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: workload container did not become ready"
          docker logs "$WORKLOAD_CONTAINER" || true
          exit 1

      - name: Load the SBoB audit fragment into the kernel
        run: |
          docker cp dist/php/wazuh/audit/sbob/php-fpm.rules "$WORKLOAD_CONTAINER:/opt/audit.rules"
          docker exec "$WORKLOAD_CONTAINER" auditctl -R /opt/audit.rules
          echo "--- loaded rules ---"
          docker exec "$WORKLOAD_CONTAINER" auditctl -l

      - name: Run the benign + post-exploit request flows and capture the windows
        run: |
          set -o pipefail
          docker exec "$WORKLOAD_CONTAINER" bash /opt/harness/run-behaviors.sh 2>&1 | tee workload-run.log
          mkdir -p telemetry-run
          docker cp "$WORKLOAD_CONTAINER:/opt/telemetry/benign.audit" telemetry-run/benign.audit
          docker cp "$WORKLOAD_CONTAINER:/opt/telemetry/drift.audit" telemetry-run/drift.audit
          docker exec "$WORKLOAD_CONTAINER" sh -c \
            'grep -E "^(type=SYSCALL|type=EXECVE|type=PATH|type=SOCKADDR)" /var/log/audit/audit.log | tail -200' \
            > telemetry-run/audit-tail.log || true
          echo "--- benign window ---"; cat telemetry-run/benign.audit
          echo "--- drift window ---"; cat telemetry-run/drift.audit

      - name: Capture parity + safety check (loopback-only, benign purity, all four signatures)
        run: |
          set -o pipefail
          python3 scenarios/php2shell/harness/check_capture.py \
            telemetry-run/benign.audit telemetry-run/drift.audit 2>&1 | tee parity-check.log

      - name: Upload telemetry artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php2shell-telemetry
          path: |
            telemetry-run/benign.audit
            telemetry-run/drift.audit
            telemetry-run/audit-tail.log
            workload-run.log
            parity-check.log
            corpus-gate.log
            api-gate.log
            live-benign-gate.log
            live-drift-gate.log
          if-no-files-found: error

      # ---- detection stack: the proven lab-validate pattern, pinned SBoB ----

      - name: Start the disposable Wazuh manager (4.14.6)
        run: |
          docker pull "$WAZUH_IMAGE"
          docker run -d --name "$WAZUH_CONTAINER" \
            -p 1514:1514 -p 1515:1515 -p 55000:55000 \
            "$WAZUH_IMAGE"
          for i in $(seq 1 96); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$WAZUH_API" || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then echo "manager API up (HTTP $code)"; exit 0; fi
            if [ $((i % 12)) -eq 0 ]; then echo "...still waiting for the API (HTTP $code)"; fi
            sleep 5
          done
          echo "manager API did not come up"
          docker logs --tail 60 "$WAZUH_CONTAINER" || true
          exit 1

      - name: Install the bundle + declare the CDB lists in ossec.conf
        run: |
          sh sbob-repo/scripts/sync-manager.sh dist/php --root staging
          find staging -type f | sort
          if [ -d staging/rules ]; then
            docker cp staging/rules/. "$WAZUH_CONTAINER:/var/ossec/etc/rules/"
          fi
          if [ -d staging/decoders ]; then
            docker cp staging/decoders/. "$WAZUH_CONTAINER:/var/ossec/etc/decoders/"
          fi
          if [ -d staging/lists ]; then
            docker cp staging/lists/. "$WAZUH_CONTAINER:/var/ossec/etc/lists/"
          fi
          docker cp "$WAZUH_CONTAINER:/var/ossec/etc/ossec.conf" ossec.conf
          : > sbob-lists.snippet
          if [ -d staging/lists/sbob ]; then
            (cd staging/lists && find sbob -type f | sort) | while read -r rel; do
              printf '    <list>etc/lists/%s</list>\n' "$rel"
            done >> sbob-lists.snippet
          fi
          if [ -s sbob-lists.snippet ]; then
            awk '
              BEGIN { while ((getline l < "sbob-lists.snippet") > 0) ins = ins l ORS }
              !done && /<\/ruleset>/ { printf "%s", ins; done = 1 }
              { print }
            ' ossec.conf > ossec.conf.new
            mv ossec.conf.new ossec.conf
            echo "declared lists:" && grep "<list>etc/lists/sbob" ossec.conf
          else
            echo "no CDB lists in this bundle — ossec.conf left untouched"
          fi
          docker cp ossec.conf "$WAZUH_CONTAINER:/var/ossec/etc/ossec.conf"

      - name: Restart the manager and wait for the API (bundle must load cleanly)
        run: |
          docker exec "$WAZUH_CONTAINER" /var/ossec/bin/wazuh-control restart 2>&1 | tee restart.log \
            || echo "wazuh-control restart rc=$? (continuing — the probe below is the gate)"
          code=000
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$WAZUH_API" || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then echo "manager API up after restart (HTTP $code)"; break; fi
            sleep 5
          done
          if [ "$code" = "000" ] || [ -z "$code" ]; then
            echo "manager API did not come back after the bundle install"
            exit 1
          fi
          if docker exec "$WAZUH_CONTAINER" /var/ossec/bin/wazuh-control status 2>/dev/null | grep -q "analysisd.*running"; then
            echo "analysisd running with the bundle loaded"
            exit 0
          fi
          echo "analysisd is NOT running — the manager rejected the ruleset"
          exit 1

      - name: Corpus gate — recorded corpus parity (proven Stage 1, pinned scripts)
        run: |
          set -o pipefail
          docker cp sbob-repo/test "$WAZUH_CONTAINER:/test"
          docker cp sbob-repo/scripts "$WAZUH_CONTAINER:/sbob-scripts"
          docker exec "$WAZUH_CONTAINER" \
            bash -c 'PATH="/var/ossec/bin:$PATH" bash /sbob-scripts/logtest-corpus.sh php' 2>&1 | tee corpus-gate.log

      - name: API gate — recorded corpus, JSON-asserted ids + sustained children
        run: |
          set -o pipefail
          SBOB_WAZUH_API_USER="$WAZUH_API_USER" SBOB_WAZUH_API_PASS="$WAZUH_API_PASS" \
            node sbob-repo/scripts/logtest-api.ts --target php --api "$WAZUH_API" 2>&1 | tee api-gate.log

      - name: Live gate — benign telemetry silent (8 passes, one session, sustained children must stay silent too)
        run: |
          set -o pipefail
          SBOB_WAZUH_API_USER="$WAZUH_API_USER" SBOB_WAZUH_API_PASS="$WAZUH_API_PASS" \
            node scenarios/php2shell/harness/logtest-replay.ts \
            --api "$WAZUH_API" \
            --file telemetry-run/benign.audit --mode benign --repeats 8 2>&1 | tee live-benign-gate.log

      - name: Live gate — drift telemetry fires 100111/100121/100131/100163 + sustained 100112/100122/100132
        run: |
          set -o pipefail
          SBOB_WAZUH_API_USER="$WAZUH_API_USER" SBOB_WAZUH_API_PASS="$WAZUH_API_PASS" \
            node scenarios/php2shell/harness/logtest-replay.ts \
            --api "$WAZUH_API" \
            --file telemetry-run/drift.audit --mode drift \
            --expect 100111,100121,100131,100163 \
            --expect-sustained 100112,100122,100132 --repeats 8 2>&1 | tee live-drift-gate.log

      - name: Verdict summary
        if: always()
        run: |
          {
            echo "## php-detection verdict"
            echo "| gate | verdict |"
            echo "|---|---|"
            for f in workload-run.log parity-check.log corpus-gate.log api-gate.log live-benign-gate.log live-drift-gate.log; do
              if [ ! -f "$f" ]; then v="(not reached)"; \
              elif grep -qE "^FAIL:|^ERROR:" "$f"; then v="**FAIL** (see $f)"; \
              else v="PASS (see $f)"; fi
              echo "| $f | $v |"
            done
            echo "SBoB toolchain pin: \`${SBOB_PIN}\` ; manager: \`$WAZUH_IMAGE\`"
            echo "Telemetry windows: attached as the \`php2shell-telemetry\` artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure diagnostics (step summary)
        if: failure()
        run: |
          {
            echo "## php-detection diagnostics"
            echo '```'
            echo "--- workload container ---"
            docker ps -a 2>&1 | sed -n 1,20p || true
            docker logs --tail 80 "$WORKLOAD_CONTAINER" 2>&1 || true
            echo "--- auditctl ---"
            docker exec "$WORKLOAD_CONTAINER" auditctl -l 2>&1 || true
            docker exec "$WORKLOAD_CONTAINER" auditctl -s 2>&1 || true
            echo "--- audit log tail ---"
            docker exec "$WORKLOAD_CONTAINER" sh -c 'tail -80 /var/log/audit/audit.log' 2>&1 || true
            echo "--- manager ossec.log tail ---"
            docker exec "$WAZUH_CONTAINER" sh -c 'tail -40 /var/ossec/logs/ossec.log' 2>&1 || true
            echo "--- gate logs ---"
            for f in workload-run.log parity-check.log corpus-gate.log api-gate.log live-benign-gate.log live-drift-gate.log; do
              [ -f "$f" ] && { echo "### $f (tail 40)"; tail -40 "$f"; }
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # annotation channel: surface the first failure line
          for f in workload-run.log parity-check.log corpus-gate.log api-gate.log live-benign-gate.log live-drift-gate.log; do
            if [ -f "$f" ]; then
              line=$(grep -m1 -E "FAIL:|ERROR:" "$f" || true)
              if [ -n "$line" ]; then
                echo "::error::$f: $(printf '%s' "$line" | head -c 900 | tr '\n' '~')"
                break
              fi
            fi
          done
