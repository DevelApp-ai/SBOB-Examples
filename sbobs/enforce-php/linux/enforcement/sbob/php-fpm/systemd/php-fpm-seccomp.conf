# sbobctl generated syscall-surface filter — workload: php-fpm (TDS 14.2, M7)
# install as /etc/systemd/system/<unit>.d/50-sbob-php-fpm-seccomp.conf
# ENFORCE: violations fail with EPERM
[Service]
# RestrictAddressFamilies etc. stay with the unit's own hardening; this drop-in
# only pins the SBoB signature syscall surface (deny-list semantics).
SystemCallFilter=~init_module finit_module delete_module unshare setns ptrace process_vm_readv process_vm_writev memfd_create
