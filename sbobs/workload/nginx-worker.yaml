# ---------------------------------------------------------------------------
# SBOB-EXAMPLES DEMO — scenario D (issue #15, M9) workload profile: an
# HTTP/2-enabled nginx container (official nginx image) — the deployment shape
# NGINX2Root (CVE-2026-123007 et al., disclosed 2026-11-18 by Xint) was
# demonstrated against. Commands from the RCE run with the privileges of the
# nginx WORKER process. The CVE entry vector is invisible to SBoB by nature;
# the contract below is what post-RCE worker behavior drifts against.
#
# Contract decisions (same honesty discipline as scenarios B/C):
#   - execs: the nginx binaries only. A worker never shells out in benign
#     operation, so any /bin/sh execve from a worker is drift by definition.
#   - opens: nginx conf read, log/cache write dirs, web root read, resolver
#     read. /etc/passwd and /etc/shadow are NOT declared: recon reads are
#     drift (and /etc/shadow additionally trips the sensitive-file overlay).
#   - egress: the declared upstream only. A C2 callback to any other peer is
#     drift (the loopback stand-in is never declared).
#   - the SCTP autoload path is host-scope: the first SCTP socket open loads
#     the sctp kernel module — the module-load signature (node-scoped key)
#     fires; see node-host.yaml for the host-scope SBoB.
# ---------------------------------------------------------------------------
apiVersion: sbob.k8sstormcenter.io/v1
kind: SoftwareBillOfBehavior
metadata:
  name: nginx-worker
  namespace: web-tier
  annotations:
    sbob.spec-version: "0.0.4"
spec:
  imageID: docker.io/library/nginx@sha256:c2d3e4f5a60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a2
  execs:
  - path: /usr/sbin/nginx
    args: ['/usr/sbin/nginx', '…']
  opens:
  - flags: [O_RDONLY]
    path: /etc/nginx/*
  - flags: [O_RDONLY]
    path: /var/www/html/*
  - flags: [O_RDONLY, O_WRONLY, O_CREAT]
    path: /var/log/nginx/*
  - flags: [O_RDONLY, O_WRONLY, O_CREAT]
    path: /var/cache/nginx/*
  - flags: [O_RDONLY]
    path: /etc/resolv.conf
  egress:
  - identifier: internal-app-upstream
    type: internal
    ipAddresses: [10.96.100.40/32]
    ports: [{name: TCP-8080, protocol: TCP, port: 8080}]
  ingress:
  - identifier: edge-frontends
    ipAddresses: [10.244.0.0/16]
    ports: [{name: TCP-80, protocol: TCP, port: 80}]
