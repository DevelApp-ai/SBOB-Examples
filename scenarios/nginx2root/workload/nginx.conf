# SBOB-EXAMPLES DEMO WATERMARK — scenario D fixture nginx config (issue #15).
# Declared behavior only: serve the web root (opens[] /var/www/html/* read,
# /var/log/nginx/* write) and proxy to the declared upstream
# (egress[] 10.96.100.40:8080, loopback-local alias).
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events { worker_connections 64; }

http {
    access_log /var/log/nginx/access.log;
    server {
        listen 80;
        location / {
            root /var/www/html;
        }
        location /upstream {
            proxy_pass http://10.96.100.40:8080;
        }
    }
}
