; SBOB-EXAMPLES DEMO WATERMARK — scenario B workload fixture (php-fpm pool).
; Demo reconstruction, loopback-only stand-ins (TDS §4). See Dockerfile header.
;
; Pool layout mirrors the SBoB php contract: master + www-data workers
; (uid 33 — the corpus uid). The listen address is the fastcgi endpoint the
; declared nginx ingress fronts in the contract; for the detection demo the
; fastcgi client stand-in (cgi-fcgi, run as root) plays the frontend. Its
; connect() never reaches the SBoB audit rules (they are exe-scoped to
; /usr/local/sbin/php-fpm), so the ingress stand-in is telemetry-neutral.

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
; stable workers for the capture windows: dynamic pool, both workers up at
; start (before any window opens), no per-request respawns
pm = dynamic
pm.max_children = 2
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 0
; no access log files (undeclared opens would be benign-window noise;
; stdout/stderr pipes are inherited, not opened per request)
;access.log = /proc/self/fd/1
catch_workers_output = yes
clear_env = no
