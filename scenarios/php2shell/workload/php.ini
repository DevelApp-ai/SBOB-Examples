; SBOB-EXAMPLES DEMO WATERMARK — scenario B workload fixture (php.ini).
; Demo reconstruction, loopback-only stand-ins (TDS §4). See Dockerfile header.

; the contract's only declared write path
session.save_path = "/var/lib/php/sessions"
; no session GC opendir() inside capture windows (the bare session dir is
; not a declared opens[] entry; the sess_* files are)
session.gc_probability = 0

; FFI powers behavior 4 (memfd_create staging via FFI, the fileless variant);
; the default "preload" value blocks FFI in the fpm web SAPI
ffi.enable = true

; deterministic timezone: no tzfile reads at request time
date.timezone = UTC
