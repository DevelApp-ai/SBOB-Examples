; SBOB-EXAMPLES DEMO WATERMARK — scenario B workload fixture (php-fpm).
; Demo reconstruction, loopback-only stand-ins (TDS §4). See Dockerfile header.

[global]
daemonize = no
error_log = /proc/self/fd/2
; no pid file: the container is disposable and the master runs in the
; entrypoint's process group
pid = /run/php-fpm.pid
include = etc/php-fpm.d/*.conf
